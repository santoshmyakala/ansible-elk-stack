---
- name: Check for an existing Docker installation
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: docker_host_existing
  changed_when: false
  failed_when: false

- name: Install Docker Engine
  when: docker_host_install and docker_host_existing.rc != 0
  block:
    - name: Add Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io]
        update_cache: true

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Raise vm.max_map_count for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: true
  when: docker_host_set_max_map_count

- name: Create base directory
  ansible.builtin.file:
    path: "{{ elk_base_dir }}"
    state: directory
    mode: "0750"

- name: Create Docker network
  community.docker.docker_network:
    name: "{{ elk_network }}"
